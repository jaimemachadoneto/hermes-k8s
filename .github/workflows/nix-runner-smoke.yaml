name: nix-runner-smoke

# The smoke test of the runner arc-jmn-nix. It runs only on a push and on
# request, never for a pull request: the Nix store of the runner persists,
# so code from a fork must not write to it.
on:
  push:
    branches:
      - main
      - ci/arc-jmn-nix
    paths:
      - .github/workflows/nix-runner-smoke.yaml
      - .github/actions/setup-nix/**
      - .github/nix-runner-smoke/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arc-jmn-nix
  cancel-in-progress: false

jobs:
  build:
    runs-on: arc-jmn-nix
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - id: nix
        uses: ./.github/actions/setup-nix

      - name: Build the image
        working-directory: .github/nix-runner-smoke
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
          NIX_INSTALLED: ${{ steps.nix.outputs.installed }}
        run: |
          set -euo pipefail
          nix --version
          out_path=$(nix eval --raw .#image.outPath)
          if nix path-info "$out_path" >/dev/null 2>&1; then reused=true; else reused=false; fi
          out=$(nix build .#image --no-link --print-out-paths)
          digest=$(nix run --inputs-from . nixpkgs#skopeo -- \
            inspect --format '{{.Digest}}' "docker-archive:$out")
          {
            echo "### arc-jmn-nix smoke test"
            echo "- Nix installed in this run: $NIX_INSTALLED"
            echo "- Image found in the store before the build: $reused"
            echo "- Image: \`$out\`"
            echo "- Digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "image digest: $digest"
          # A run again of the same commit must find the image in the store.
          # A run that installed Nix had an empty store, so it is not a run
          # again for the store, also when its attempt number is above 1.
          if [ "$RUN_ATTEMPT" -gt 1 ] && [ "$NIX_INSTALLED" = false ] && [ "$reused" != true ]; then
            echo "::error::The store did not keep the image of the first run."
            exit 1
          fi
