name: release

# `deploy patch|minor|major` pushes the tag vX.Y.Z that starts this workflow.
# The workflow checks and builds both images. It scans them. It pushes them
# to ghcr.io as X.Y.Z and sha-<commit>. Then it opens a PR in home-ops that
# sets the new references with their digests. Flux applies the PR after the
# merge.
#
# The secret MY_PAT is a token that can push a branch to home-ops and open a
# PR there. The other projects use the same secret.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# Its own group: a release must not be cancelled by a newer CI run.
concurrency:
  group: release
  cancel-in-progress: false

env:
  HERMES_IMAGE: ghcr.io/jaimemachadoneto/hermes
  SANDBOX_IMAGE: ghcr.io/jaimemachadoneto/hermes-sandbox
  GITOPS_FILE: kubernetes/apps/ai/hermes/app/helmrelease.yaml

jobs:
  publish:
    runs-on: arc-jmn-nix
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      hermes-tag: ${{ steps.push.outputs.hermes-tag }}
      sandbox-ref: ${{ steps.push.outputs.sandbox-ref }}
      version: ${{ steps.push.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag on another branch must not publish images.
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: ./.github/actions/setup-nix

      - name: Flake check
        run: nix flake check

      - name: Build the images
        run: |
          set -euo pipefail
          nix build .#sandbox-image --no-link
          nix build .#hermes-image --no-link

      # Scan the images before the push. A failed scan keeps the image off the registry.
      # The scan looks at the tarball, so it needs no registry and no daemon.
      # .trivyignore.yaml holds the accepted findings, each with a reason and an expiry.
      # Scan each image before the step fails, so one run shows all the findings.
      - name: Scan the images
        run: |
          set -euo pipefail
          failed=0
          for attr in sandbox-image hermes-image; do
            out=$(nix build ".#$attr" --no-link --print-out-paths)
            nix shell --inputs-from . nixpkgs#trivy -c trivy image \
              --input "$out" --severity HIGH,CRITICAL --ignore-unfixed \
              --ignorefile .trivyignore.yaml --exit-code 1 || failed=1
          done
          exit "$failed"

      - name: Push the images
        id: push
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=${REF_NAME#v}
          push() {
            nix shell --inputs-from . nixpkgs#skopeo -c \
              scripts/publish-image.sh "$1" "$2" "sha-$COMMIT" "$version"
          }
          sandbox_ref=$(push sandbox-image "$SANDBOX_IMAGE")
          hermes_ref=$(push hermes-image "$HERMES_IMAGE")
          {
            echo "version=$version"
            echo "sandbox-ref=$sandbox_ref"
            echo "hermes-tag=${hermes_ref#"$HERMES_IMAGE:"}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Images"
            echo "- \`$sandbox_ref\`"
            echo "- \`$hermes_ref\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # If this job fails, the images are on ghcr.io already. Run the job again.
  gitops:
    needs: publish
    runs-on: arc-jmn-nix
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.publish.outputs.version }}
      HERMES_TAG: ${{ needs.publish.outputs.hermes-tag }}
      SANDBOX_REF: ${{ needs.publish.outputs.sandbox-ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          repository: jaimemachadoneto/home-ops
          token: ${{ secrets.MY_PAT }}
          path: gitops

      - name: Set the image references
        run: |
          set -euo pipefail
          python3 scripts/set-image-refs.py "gitops/$GITOPS_FILE" \
            --hermes-tag "$HERMES_TAG" --sandbox-ref "$SANDBOX_REF"
          git -C gitops --no-pager diff

      - name: Open the deploy PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: gitops
          token: ${{ secrets.MY_PAT }}
          branch: deploy/${{ github.event.repository.name }}-${{ needs.publish.outputs.version }}
          delete-branch: true
          commit-message: deploy ${{ github.event.repository.name }} ${{ needs.publish.outputs.version }}
          title: deploy ${{ github.event.repository.name }} ${{ needs.publish.outputs.version }}
          body: |
            Set the Hermes image and the sandbox image (`HERMES_K8S_SANDBOX_IMAGE`) in `${{ env.GITOPS_FILE }}`. Each reference has its digest.

            - Hermes: `${{ env.HERMES_TAG }}`
            - Sandbox: `${{ env.SANDBOX_REF }}`
            - Source: ${{ github.server_url }}/${{ github.repository }}/tree/v${{ needs.publish.outputs.version }}
            - Build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Flux applies this PR after the merge.
