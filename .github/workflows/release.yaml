name: release

# `deploy patch|minor|major` pushes the tag vX.Y.Z that starts this workflow.
# This workflow builds nothing. CI on main built, scanned and pushed the images as
# sha-<commit>. The job `promote` finds the green CI run of the commit of the tag. Then it
# adds the tag X.Y.Z to the same images, with the same digests. The job `gitops` opens a PR
# in home-ops that sets the new references with their digests. Flux applies the PR after the
# merge.
#
# The secret MY_PAT is a token that can push a branch to home-ops and open a
# PR there. The other projects use the same secret.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# Its own group: a release must not be cancelled by a newer CI run.
concurrency:
  group: release
  cancel-in-progress: false

env:
  HERMES_IMAGE: ghcr.io/jaimemachadoneto/hermes
  SANDBOX_IMAGE: ghcr.io/jaimemachadoneto/hermes-sandbox
  GITOPS_FILE: kubernetes/apps/ai/hermes/app/helmrelease.yaml

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    outputs:
      hermes-tag: ${{ steps.copy.outputs.hermes-tag }}
      sandbox-ref: ${{ steps.copy.outputs.sandbox-ref }}
      version: ${{ steps.copy.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag on another branch must not publish images.
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # The images of the tag are the images that this run of CI built, scanned and pushed.
      # A run of CI on a push is green only when its job `publish` passed.
      - name: CI on main passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yaml \
            --commit "$GITHUB_SHA" --branch main --event push --status success \
            --json databaseId --jq 'length')
          if [ "$runs" -lt 1 ]; then
            echo "::error::No successful run of ci.yaml on main for commit $GITHUB_SHA. Wait for CI on main, or run it again, then run this release again."
            exit 1
          fi

      # skopeo is on the hosted runner. The step fails if a new image of the runner drops it.
      - name: Copy the images to the release tag
        id: copy
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          skopeo --version
          version=${REF_NAME#v}
          sandbox_ref=$(scripts/promote-image.sh "$SANDBOX_IMAGE" "sha-$COMMIT" "$version")
          hermes_ref=$(scripts/promote-image.sh "$HERMES_IMAGE" "sha-$COMMIT" "$version")
          {
            echo "version=$version"
            echo "sandbox-ref=$sandbox_ref"
            echo "hermes-tag=${hermes_ref#"$HERMES_IMAGE:"}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Images"
            echo "- \`$sandbox_ref\`"
            echo "- \`$hermes_ref\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # If this job fails, the images have the release tag already. Run the job again.
  gitops:
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.promote.outputs.version }}
      HERMES_TAG: ${{ needs.promote.outputs.hermes-tag }}
      SANDBOX_REF: ${{ needs.promote.outputs.sandbox-ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          repository: jaimemachadoneto/home-ops
          token: ${{ secrets.MY_PAT }}
          path: gitops

      - name: Set the image references
        run: |
          set -euo pipefail
          python3 scripts/set-image-refs.py "gitops/$GITOPS_FILE" \
            --hermes-tag "$HERMES_TAG" --sandbox-ref "$SANDBOX_REF"
          git -C gitops --no-pager diff

      - name: Open the deploy PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: gitops
          token: ${{ secrets.MY_PAT }}
          branch: deploy/${{ github.event.repository.name }}-${{ needs.promote.outputs.version }}
          delete-branch: true
          commit-message: deploy ${{ github.event.repository.name }} ${{ needs.promote.outputs.version }}
          title: deploy ${{ github.event.repository.name }} ${{ needs.promote.outputs.version }}
          body: |
            Set the Hermes image and the sandbox image (`HERMES_K8S_SANDBOX_IMAGE`) in `${{ env.GITOPS_FILE }}`. Each reference has its digest.

            - Hermes: `${{ env.HERMES_TAG }}`
            - Sandbox: `${{ env.SANDBOX_REF }}`
            - Source: ${{ github.server_url }}/${{ github.repository }}/tree/v${{ needs.promote.outputs.version }}
            - Build: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Flux applies this PR after the merge.
