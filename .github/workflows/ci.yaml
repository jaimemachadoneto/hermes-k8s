name: ci

# This workflow checks each pull request on a GitHub-hosted runner. A pull request
# from a fork runs only after approval. The repository setting "Require approval for
# all external contributors" gives this approval. The trigger is pull_request, so a
# fork gets no secret and gets a read-only token.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its old run. The key is the number of the pull
# request, so two forks with the same branch name do not share it. Each run on main has its
# own group, so each commit gets a run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # A hosted runner has little free disk space. The build of the images needs much of it.
      # Remove the toolchains that this job does not use.
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # The cache is public. A pull request only reads it.
      # The license of claude-code does not allow redistribution. Each image contains
      # claude-code. The filter keeps claude-code, its download and the image paths out of
      # the cache.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: hermes-k8s
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.event_name == 'pull_request' }}
          pushFilter: '(claude-code|hermes(-sandbox)?\.tar\.gz$|-stream-|customisation-layer|-layers\.json$|-conf\.json$|-excludePaths$|-claude\.zst$)'

      - name: Flake check
        run: nix flake check

      # The tests need Python 3.14 and the Hermes package. uv installs both.
      - name: Tests
        run: nix shell --inputs-from . nixpkgs#uv nixpkgs#git -c uv run pytest
