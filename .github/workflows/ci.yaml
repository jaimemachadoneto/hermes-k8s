name: ci

# This workflow checks each pull request on the runner arc-jmn-nix. The runner
# is in the home cluster, so a pull request from a fork never runs here.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Each runner has its own clone of the Nix store, so runs need no shared lock. A new push to a
# pull request cancels its old run. Each run on main has its own group, so each commit gets a run.
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: arc-jmn-nix
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: ./.github/actions/setup-nix

      - name: Flake check
        run: nix flake check

      # The tests need Python 3.14 and the Hermes package. uv installs both.
      - name: Tests
        run: nix shell --inputs-from . nixpkgs#uv nixpkgs#git -c uv run pytest
