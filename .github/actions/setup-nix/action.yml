name: Set up Nix on arc-jmn-nix
description: >-
  Install single-user Nix on the persistent /nix volume of the runner
  arc-jmn-nix at the first run, then put Nix on the PATH. Later runs reuse
  the store on the volume.
inputs:
  nix-version:
    description: The Nix release to install at the first run.
    default: "2.34.9"
  nix-sha256:
    description: The SHA-256 of nix-<version>-x86_64-linux.tar.xz.
    default: e8912e087582b3799e0e5a6b06f9d63386c54821f77ad4de3b9b748736ad364e
outputs:
  installed:
    description: true when this run installed Nix, false when Nix was on the volume.
    value: ${{ steps.install.outputs.installed }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        NIX_VERSION: ${{ inputs.nix-version }}
        NIX_SHA256: ${{ inputs.nix-sha256 }}
      run: |
        set -euo pipefail
        # The home of a runner pod is lost with the pod. Only /nix persists,
        # so the system profile under /nix holds Nix and keeps it from GC.
        profile=/nix/var/nix/profiles/default
        if [ ! -w /nix ]; then
          echo "::error::/nix is not writable. The runner must mount the Nix volume at /nix."
          exit 1
        fi
        # NIX_CONFIG of the runner sets build-dir to this directory.
        mkdir -p /nix/var/nix/builds
        # The pod has fsGroup, so kubelet sets the setgid bit on /nix and each
        # new directory under it inherits the bit. The syscall filter of Nix
        # refuses a chmod of a setgid directory (EPERM), so each build that
        # runs chmod fails. This runs outside Nix, so no filter applies. A build
        # directory takes the bit from this parent when Nix creates it.
        chmod g-s /nix/var/nix/builds
        ls -ldn /nix /nix/var/nix/builds
        if [ -x "$profile/bin/nix" ]; then
          echo "installed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        work=$(mktemp -d)
        tarball="nix-${NIX_VERSION}-x86_64-linux"
        curl -fsSL -o "$work/$tarball.tar.xz" \
          "https://releases.nixos.org/nix/nix-${NIX_VERSION}/$tarball.tar.xz"
        echo "${NIX_SHA256}  $work/$tarball.tar.xz" | sha256sum -c -
        # The runner image has no xz, so Python unpacks the archive.
        python3 -c 'import lzma, sys, tarfile; tarfile.open(fileobj=lzma.open(sys.argv[1])).extractall(sys.argv[2], filter="tar")' \
          "$work/$tarball.tar.xz" "$work"
        "$work/$tarball/install" --no-daemon --no-channel-add --no-modify-profile
        nix_path=$(find /nix/store -maxdepth 1 -type d -name "*-nix-${NIX_VERSION}" | head -n 1)
        "$nix_path/bin/nix-env" --profile "$profile" --set "$nix_path"
        rm -rf "$work"
        echo "installed=true" >> "$GITHUB_OUTPUT"
    - shell: bash
      run: echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
