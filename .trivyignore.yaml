# Findings that the release scan accepts. Each entry is limited to one package path, so the
# same ID in another package still fails the scan. Each entry expires: then the scan fails
# again, and a person examines the finding again.
vulnerabilities:
  # devenv 2.4.0 is the newest devenv in nixpkgs. The fix needs new crates in devenv itself.
  - id: CVE-2026-44471
    paths: ["nix/store/*-devenv-2.4.0/**"]
    statement: >-
      gix-fs in devenv. No devenv release in nixpkgs has the fix. The sandbox has no
      service-account token and a strict network policy, which limits a path traversal.
    expired_at: 2026-12-22
  - id: GHSA-p3hw-mv63-rf9w
    paths: ["nix/store/*-devenv-2.4.0/**"]
    statement: >-
      gix-validate in devenv. No devenv release in nixpkgs has the fix. The sandbox has no
      service-account token and a strict network policy, which limits a path traversal.
    expired_at: 2026-12-22
  - id: GHSA-82j2-j2ch-gfr8
    paths: ["nix/store/*-devenv-2.4.0/**"]
    statement: >-
      rustls-webpki in devenv. A bad CRL can stop one devenv process. No devenv release in
      nixpkgs has the fix.
    expired_at: 2026-12-22
  # Upstream Hermes pins Node 26.12.1 (pm/lock.json). Hermes puts its own npm 12 on bin/npm,
  # so the npm that Node bundles does not run.
  - id: CVE-2026-102276
    paths: ["nix/store/*-node-26.12.1/lib/node_modules/npm/**"]
    statement: >-
      brace-expansion in the npm that Node bundles. That npm does not run, because Hermes
      puts its pinned npm 12 on bin/npm. Upstream Hermes pins this Node.
    expired_at: 2026-12-22
  - id: CVE-2026-102278
    paths: ["nix/store/*-node-26.12.1/lib/node_modules/npm/**"]
    statement: >-
      brace-expansion in the npm that Node bundles. That npm does not run, because Hermes
      puts its pinned npm 12 on bin/npm. Upstream Hermes pins this Node.
    expired_at: 2026-12-22
